spring.datasource.url=jdbc:mysql://localhost:3306/bolsa_empleo
spring.datasource.username=root
spring.datasource.password=root

# Nuestro script SQL es la fuente de verdad: Hibernate no toca el esquema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# JWT (la clave debe tener al menos 32 caracteres para HS256)
app.jwt.secret=ClaveSecretaSuperLargaParaBolsaEmpleoUNA2026Programacion4xyz
app.jwt.expiration-ms=86400000

# Carpeta donde se guardan los CV y tamaño máximo de subida
app.upload-dir=uploads/cv
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB